<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Remote Shell</title>
  <link href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      font-family: "Fira Code", monospace;
      background-color: #1e1e1e;
      color: #fff;
    }
    #terminal {
      height: 100vh;
      width: 100vw;
      padding: 10px;
    }
    #authModal {
      position: absolute;
      top: 0;
      left: 0;
      height: 100vh;
      width: 100vw;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    #authModal input {
      padding: 10px;
      font-size: 1rem;
      margin: 5px;
      border: none;
      border-radius: 5px;
      background: #333;
      color: #fff;
    }
    #authModal button {
      margin-top: 10px;
      padding: 10px 20px;
      background: #007acc;
      border: none;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="authModal">
    <input type="text" id="username" placeholder="Username" />
    <input type="password" id="password" placeholder="Password" />
    <button onclick="connect()">Login</button>
  </div>
  <div id="terminal"></div>

  <script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
  <script>
    const term = new Terminal({
      theme: {
        background: "#1e1e1e",
        foreground: "#ffffff"
      },
      fontFamily: "Fira Code, monospace",
      cursorBlink: true
    });

    term.open(document.getElementById("terminal"));

    let socket;

    function connect() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;
      document.getElementById("authModal").style.display = "none";

      socket = new WebSocket("ws://localhost:3000");

      socket.addEventListener("open", () => {
        socket.send(JSON.stringify({ type: "auth", username, password }));
        term.write("🔐 Authenticating...\r\n");
      });

      socket.addEventListener("message", (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === "auth" && msg.status === "success") {
          term.write("✅ Authenticated. Welcome!\r\n");
        } else if (msg.type === "auth" && msg.status === "failure") {
          term.write("❌ Authentication failed.\r\n");
          socket.close();
        } else if (msg.type === "data") {
          term.write(msg.data);
        }
      });

      term.onData(data => {
        socket.send(JSON.stringify({ type: "data", data }));
      });

      socket.addEventListener("close", () => {
        term.write("\r\n🔌 Connection closed.\r\n");
      });
    }
  </script>
</body>
</html>
