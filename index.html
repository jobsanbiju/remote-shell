<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remote Terminal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm/css/xterm.css">
  <style>
    body {
      margin: 0;
      background-color: #1e1e1e;
      color: #cccccc;
      font-family: Consolas, monospace;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background-color: #333;
      padding: 1rem;
      text-align: center;
      font-size: 1.4rem;
      color: #d4d4d4;
      border-bottom: 1px solid #444;
    }
    #controls {
      display: flex;
      justify-content: center;
      padding: 0.5rem;
      background-color: #252526;
      border-bottom: 1px solid #444;
    }
    #socketInput {
      width: 60%;
      padding: 0.5rem;
      border: none;
      border-radius: 4px 0 0 4px;
      outline: none;
    }
    #connectBtn {
      padding: 0.5rem 1rem;
      border: none;
      background-color: #007acc;
      color: white;
      font-weight: bold;
      border-radius: 0 4px 4px 0;
      cursor: pointer;
    }
    #terminal {
      flex-grow: 1;
      padding: 1rem;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <header>
    <span style="margin-right: 0.5rem;">🖥️</span> Remote Terminal
  </header>
  <div id="controls">
    <input id="socketInput" placeholder="wss://...trycloudflare.com" />
    <button id="connectBtn">Connect</button>
  </div>
  <div id="terminal"></div>

  <script src="https://cdn.jsdelivr.net/npm/xterm/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit/lib/xterm-addon-fit.js"></script>
  <script>
    const socketInput = document.getElementById("socketInput");
    const connectBtn = document.getElementById("connectBtn");
    const term = new Terminal({
      cursorBlink: true,
      theme: {
        background: '#1e1e1e',
        foreground: '#cccccc',
        cursor: '#ffffff',
      }
    });
    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById("terminal"));
    fitAddon.fit();

    let socket;

    connectBtn.addEventListener("click", () => {
      if (socket) socket.close();

      socket = new WebSocket(socketInput.value.replace(/^http/, "ws"));

      socket.onopen = () => {
        term.write("\x1b[1;32m\u2705Connected to shell\x1b[0m\r\n");
        term.focus();
      };

      socket.onmessage = (e) => {
        term.write(e.data);
      };

      socket.onclose = () => {
        term.write("\r\n\x1b[1;31m\u274CConnection closed\x1b[0m\r\n");
      };

      term.onData((data) => {
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(data);
        }
      });
    });

    window.addEventListener('resize', () => fitAddon.fit());
    setTimeout(() => term.focus(), 100);
  </script>
</body>
</html>
