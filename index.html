<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Remote Terminal</title>
  <script src="https://unpkg.com/xterm/lib/xterm.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/xterm/css/xterm.css" />
  <style>
    body {
      background-color: #1e1e1e;
      color: white;
      font-family: 'Fira Code', monospace;
      text-align: center;
      margin: 0;
      padding: 0;
    }

    h1 {
      margin-top: 20px;
    }

    #terminal {
      width: 90%;
      height: 500px;
      margin: 20px auto;
    }

    input[type="text"] {
      width: 60%;
      padding: 8px;
      border: none;
      border-radius: 4px;
    }

    button {
      padding: 8px 16px;
      margin-left: 8px;
      border: none;
      border-radius: 4px;
      background-color: #007acc;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #005a9e;
    }
  </style>
</head>
<body>
  <h1>Remote Terminal</h1>
  <input type="text" id="wss" placeholder="wss://your-link.trycloudflare.com" />
  <button onclick="connect()">Connect</button>
  <div id="terminal"></div>

  <script>
    const term = new Terminal();
    term.open(document.getElementById('terminal'));
    let socket;

    function connect() {
      const url = document.getElementById('wss').value;
      socket = new WebSocket(url);

      socket.onopen = () => {
        term.write('\x1b[32m✔️ Connected to shell\x1b[0m\r\n');
        term.onData(data => socket.send(data));
      };

      socket.onmessage = event => term.write(event.data);
      socket.onclose = () => term.write('\r\n\x1b[31m❌ Connection closed\x1b[0m\r\n');
    }
  </script>
</body>
</html>
